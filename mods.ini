; Settings for the UAZ mods. 1 = on, 0 = off. ';' starts a comment.
; Sections read by the game (Java mods in code.pak) take effect on the next game start.
; [install] is read by rain_drops\install.ps1, [build] by widescreen_patch\build.ps1: run them again after a change.

[widescreen]
aspect = 1                ; keep 4:3 UI shapes on wide screens
resolution_list = 1       ; show all display modes in Options -> Video
fov = 1                   ; widen field of view on wide screens
view_distance = 1         ; scale view distance
view_distance_mul = 1.0   ; view distance multiplier, 0.1 .. 10

[cockpit]
look_turn = 1             ; turn the head into corners in cockpit view
look_turn_angle = -12     ; degrees of head turn at full steering, -60 .. 60 (negative = other way)
look_turn_speed = 0.25    ; seconds to follow, 0 .. 5

[glass_drops]
enabled = 1               ; drops on the windshield react to car motion
accel = 20.0              ; how much speed changes move the drops, 0 .. 20
bump = 5.0                ; how much bumps shake the drops, 0 .. 20

[wetness]
enabled = 1               ; ground, roads and cars get wet in rain
puddles = 1.0             ; puddle amount, 0 .. 2
force = -1                ; fixed wetness 0 .. 1 for testing, -1 = follow the weather
log = 0                   ; write wetness_log.txt in the game folder

[water]
camera = 1                ; send camera position and rain clock to the water shader (fresnel, rain rings)
trees_lod = -1            ; tree detail in the water reflection, -1 = game default
objects_lod = -1          ; object detail in the water reflection, -1 = game default
tree_refl_call = 0        ; old SetTreesBBReflMaterials call (not needed, patch_tree_refl.py does it)

[wet_cars]
bead_life = 0.1         ; seconds a water bead lives on the car paint (fade in + fade out)

[install]
windshield = 1            ; raindrop shader on the windshield
wet_terrain = 1           ; wet ground, puddles, shore fade and water shader
wet_roads = 1             ; wet roads and wheel ruts
wet_cars = 1              ; wet car paint and water beads
grass_sort = 1            ; draw grass after trees and props
weather_cubemap = 1       ; car reflections use current weather sky

[build]
RainFX = 1                ; rain, wetness and water helpers
CockpitLook = 1           ; head turn in cockpit view
